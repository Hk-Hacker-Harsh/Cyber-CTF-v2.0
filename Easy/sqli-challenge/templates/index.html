<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Arcade Terminal - Admin Gateway</title>
  <style>
    body {
      background-color: #0f111a;
      color: #00ff66;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .login-card {
      background: #1a1d2e;
      border: 2px solid #00ff66;
      padding: 30px;
      border-radius: 8px;
      width: 350px;
      box-shadow: 0 0 15px rgba(0, 255, 102, 0.2);
    }
    h2 { text-align: center; margin-top: 0; }
    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 10px;
      margin: 8px 0 16px 0;
      background: #0f111a;
      border: 1px solid #00ff66;
      color: #fff;
      font-family: monospace;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #00ff66;
      color: #000;
      font-weight: bold;
      border: none;
      cursor: pointer;
    }
    .msg { margin-top: 15px; font-size: 14px; text-align: center; }
    .success { color: #00ff66; }
    .error { color: #ff3366; }
    .flag {
      margin-top: 15px;
      padding: 10px;
      background: #252a40;
      border: 1px dashed #00ff66;
      word-break: break-all;
      text-align: center;
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <h2>[ ADMIN GATEWAY ]</h2>
    <form method="POST">
      <label>Username:</label>
      <input type="text" name="username" placeholder="Enter username..." autocomplete="off">
      
      <label>Password:</label>
      <input type="password" name="password" placeholder="Enter password..." autocomplete="off">
      
      <button type="submit">AUTHENTICATE</button>
    </form>

    {% if message %}
      <div class="msg {% if success %}success{% else %}error{% endif %}">
        {{ message }}
      </div>
    {% endif %}

    {% if flag %}
      <div class="flag">
        <strong>FLAG:</strong> {{ flag }}
      </div>
    {% endif %}
  </div>
</body>
</html>
